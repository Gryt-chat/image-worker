name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22, matching the Dockerfile's builder and what Release Media Worker sets up.
          # Testing on anything newer would test something this service does not run on.
          node-version: "22"
          cache: yarn

      # --ignore-scripts, the way the Dockerfile installs: sharp's install script fetches a
      # prebuilt binary, and CI only needs to typecheck against its types.
      - run: yarn install --frozen-lockfile --ignore-scripts

      # `build` is tsc, and that is the whole check — nothing compiled a pull request here
      # before, so a type error reached main. No lint step: there is no eslint config.
      - run: yarn build

      # The poster tests run the real ffmpeg under prlimit. With CI set they fail rather
      # than skip when it is missing, so this install is what makes them count.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: yarn test

      # No comment runs past two lines. The script carries the list of paths still
      # to be swept, and that list only ever shrinks.
      - run: yarn test:comment-length
      - run: yarn typecheck:scripts

      # Code here is TypeScript so its types get checked (GRYT-1800). A file that has to stay
      # JavaScript goes in .js-allowlist, one path a line, with a # comment saying why.
      - name: No new JavaScript
        run: |
          allowed=$(grep -v '^#' .js-allowlist 2>/dev/null || true)
          found=$(git ls-files '*.js' '*.mjs' '*.cjs' '*.jsx' | grep -vxF -e "$allowed" -e '' || true)
          if [ -n "$found" ]; then
            echo "::error::JavaScript not on .js-allowlist. Write it in TypeScript (GRYT-1800):"
            echo "$found"
            exit 1
          fi

  image:
    # The built image on both architectures: every poster format, every refusal, and the
    # probe that tries to read the worker's secrets from inside the ffmpeg jail.
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # One cache per architecture. A pull request only rebuilds what its diff touches,
      # so the compiled ffmpeg, dav1d and SVT-AV1 stages come back from the cache.
      - uses: docker/bake-action@v6
        with:
          source: .
          files: docker-bake.hcl
          targets: test
          load: true
          set: |
            *.cache-from=type=gha,scope=image-${{ matrix.runner }}
            *.cache-to=type=gha,scope=image-${{ matrix.runner }},mode=max
      - run: docker run --rm gryt-ff-worker-test
