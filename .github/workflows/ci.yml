name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22, matching the Dockerfile's builder and what Release Image Worker sets up.
          # Testing on anything newer would test something this service does not run on.
          node-version: "22"
          cache: yarn

      # --ignore-scripts, the way the Dockerfile installs: sharp's install script fetches a
      # prebuilt binary, and CI only needs to typecheck against its types.
      - run: yarn install --frozen-lockfile --ignore-scripts

      # `build` is tsc, and that is the whole check — nothing compiled a pull request here
      # before, so a type error reached main. No lint step: there is no eslint config.
      - run: yarn build

      # No comment runs past two lines. The script carries the list of paths still
      # to be swept, and that list only ever shrinks.
      - run: yarn test:comment-length
