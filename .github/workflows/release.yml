name: Release Image Worker

# The one component with no way to ship. Release Server moves this repository's
# gitlink and records its SHA in the release notes, but never builds its image —
# so ghcr.io/gryt-chat/image-worker sat on the version published by hand in
# March while main moved on, and anything deployed kept running that.
#
# Modelled on sfu/.github/workflows/release.yml, which has done this job for
# fifty-odd releases. Same shape deliberately: plain semver, and the channel
# decides which floating tag consumers following :latest or :latest-beta get.

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Release Channel"
        required: true
        default: "beta"
        type: choice
        options:
          - beta
          - latest
      bump:
        description: "Version Bump Type"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
          - custom
      custom_version:
        description: 'Custom Version, if "custom" is selected'
        required: false
        default: ""
        type: string

permissions:
  contents: write
  packages: write

env:
  RELEASE_OWNER: Gryt-chat
  RELEASE_REPO: image-worker
  IMAGE: ghcr.io/gryt-chat/image-worker

jobs:
  release:
    name: Release Image Worker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Git user
        shell: bash
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Determine channel
        id: channel
        shell: bash
        run: |
          set -euo pipefail

          CHANNEL="${{ github.event.inputs.channel }}"

          if [[ "$CHANNEL" != "beta" && "$CHANNEL" != "latest" ]]; then
            echo "Invalid channel: $CHANNEL"
            exit 1
          fi

          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"

      # Build before bumping. A tag pushed for something that does not compile
      # is harder to take back than a failed run.
      - name: Install and build
        shell: bash
        run: |
          set -euo pipefail
          yarn install --frozen-lockfile
          yarn build

      - name: Determine version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          # The tag is the source of truth, not package.json. main is a
          # protected branch — "changes must be made through a pull request" —
          # so a release cannot push a version-bump commit to it, and the
          # default GITHUB_TOKEN is not an admin and cannot bypass that. Tags
          # have no such rule, so the release tags and never touches the branch.
          #
          # package.json's version is therefore decorative here. Nothing reads
          # it: the package is private, never published to npm, and nothing in
          # src/ looks it up.
          CURRENT_VERSION="$(git tag --list 'v*' --sort=-v:refname | head -n1 | sed 's/^v//')"

          if [[ -z "$CURRENT_VERSION" ]]; then
            CURRENT_VERSION="$(node -p "require('./package.json').version")"
          fi
          BUMP="${{ github.event.inputs.bump }}"
          CUSTOM_VERSION="${{ github.event.inputs.custom_version }}"

          if ! [[ "$CURRENT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            echo "Invalid current version: $CURRENT_VERSION"
            exit 1
          fi

          if [[ "$BUMP" == "custom" ]]; then
            if [[ -z "$CUSTOM_VERSION" ]]; then
              echo "custom_version is required when bump=custom"
              exit 1
            fi

            if ! [[ "$CUSTOM_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
              echo "Invalid custom version: $CUSTOM_VERSION"
              echo "Expected semver like 1.2.3 or 1.2.3-beta.1"
              exit 1
            fi

            NEW_VERSION="$CUSTOM_VERSION"
          else
            BASE_VERSION="${CURRENT_VERSION%%-*}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE_VERSION"

            case "$BUMP" in
              major) NEW_VERSION="$((MAJOR + 1)).0.0" ;;
              minor) NEW_VERSION="$MAJOR.$((MINOR + 1)).0" ;;
              patch) NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))" ;;
              *)
                echo "Invalid bump type: $BUMP"
                exit 1
                ;;
            esac
          fi

          if [[ "$NEW_VERSION" == "$CURRENT_VERSION" ]]; then
            echo "Version did not change: $CURRENT_VERSION"
            exit 1
          fi

          if git rev-parse "v$NEW_VERSION" >/dev/null 2>&1; then
            echo "Tag v$NEW_VERSION already exists locally."
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/v$NEW_VERSION" >/dev/null 2>&1; then
            echo "Tag v$NEW_VERSION already exists on origin."
            exit 1
          fi

          git tag "v$NEW_VERSION"
          git push origin "v$NEW_VERSION"

          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ steps.version.outputs.version }}"
          CHANNEL="${{ steps.channel.outputs.channel }}"

          V_MAJOR="$(echo "$VERSION" | cut -d. -f1)"
          V_MINOR="$(echo "$VERSION" | cut -d. -f2)"

          # latest-beta always moves: a stable release is also the newest thing
          # a beta follower should be on, and leaving it behind would strand
          # them on an older build than the stable channel.
          TAGS=(
            "${IMAGE}:${VERSION}"
            "${IMAGE}:${V_MAJOR}.${V_MINOR}"
            "${IMAGE}:${V_MAJOR}"
            "${IMAGE}:latest-beta"
          )

          if [[ "$CHANNEL" == "latest" ]]; then
            TAGS+=("${IMAGE}:latest")
          fi

          ARGS=()
          for TAG in "${TAGS[@]}"; do
            ARGS+=(-t "$TAG")
          done

          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --cache-from type=registry,ref=${IMAGE}:buildcache \
            --cache-to type=registry,ref=${IMAGE}:buildcache,mode=max \
            "${ARGS[@]}" \
            --push .

      # discord-release-notify.yml already fires on release:published, so there
      # is no notification step here.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Gryt Image Worker v${{ steps.version.outputs.version }}
          prerelease: ${{ steps.channel.outputs.channel == 'beta' }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
