name: Release Media Worker

# The one component with no way to ship: Release Server moves this gitlink and never builds
# the image. Modelled on the SFU's release, so the channel decides the floating tag.

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Release Channel"
        required: true
        default: "beta"
        type: choice
        options:
          - beta
          - latest
      bump:
        description: "Version Bump Type"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
          - custom
      custom_version:
        description: 'Custom Version, if "custom" is selected'
        required: false
        default: ""
        type: string

permissions:
  contents: write
  packages: write

env:
  RELEASE_OWNER: Gryt-chat
  RELEASE_REPO: image-worker
  IMAGE: ghcr.io/gryt-chat/image-worker

jobs:
  release:
    name: Release Media Worker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Git user
        shell: bash
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Determine channel
        id: channel
        shell: bash
        run: |
          set -euo pipefail

          CHANNEL="${{ github.event.inputs.channel }}"

          if [[ "$CHANNEL" != "beta" && "$CHANNEL" != "latest" ]]; then
            echo "Invalid channel: $CHANNEL"
            exit 1
          fi

          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"

      # Build before bumping. A tag pushed for something that does not compile
      # is harder to take back than a failed run.
      - name: Install and build
        shell: bash
        run: |
          set -euo pipefail
          yarn install --frozen-lockfile
          yarn build

      - name: Determine version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          CHANNEL="${{ steps.channel.outputs.channel }}"

          # The tag is the source of truth, not package.json: main is protected. Stable
          # tags only, so a beta never becomes the base of the next bump.
          CURRENT_VERSION="$(
            git -c versionsort.suffix=-alpha -c versionsort.suffix=-beta -c versionsort.suffix=-rc \
                tag --list 'v*' --sort=-v:refname \
              | grep -Ex 'v[0-9]+\.[0-9]+\.[0-9]+' \
              | sed -n '1s/^v//p' || true
          )"

          if [[ -z "$CURRENT_VERSION" ]]; then
            CURRENT_VERSION="$(node -p "require('./package.json').version")"
          fi
          BUMP="${{ github.event.inputs.bump }}"
          CUSTOM_VERSION="${{ github.event.inputs.custom_version }}"

          if ! [[ "$CURRENT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid current version: $CURRENT_VERSION"
            exit 1
          fi

          if [[ "$BUMP" == "custom" ]]; then
            if [[ -z "$CUSTOM_VERSION" ]]; then
              echo "custom_version is required when bump=custom"
              exit 1
            fi

            # Same shapes checkout-release-tag.sh in Gryt-chat/gryt sorts into each channel.
            if [[ "$CHANNEL" == "beta" ]]; then
              CUSTOM_PATTERN='^[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta|rc)\.[0-9]+$'
              CUSTOM_EXAMPLE="1.2.3-beta.1"
            else
              CUSTOM_PATTERN='^[0-9]+\.[0-9]+\.[0-9]+$'
              CUSTOM_EXAMPLE="1.2.3"
            fi

            if ! [[ "$CUSTOM_VERSION" =~ $CUSTOM_PATTERN ]]; then
              echo "Invalid custom version for the $CHANNEL channel: $CUSTOM_VERSION"
              echo "Expected something like $CUSTOM_EXAMPLE"
              exit 1
            fi

            NEW_VERSION="$CUSTOM_VERSION"
          else
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"

            case "$BUMP" in
              major) NEW_VERSION="$((MAJOR + 1)).0.0" ;;
              minor) NEW_VERSION="$MAJOR.$((MINOR + 1)).0" ;;
              patch) NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))" ;;
              *)
                echo "Invalid bump type: $BUMP"
                exit 1
                ;;
            esac

            if [[ "$CHANNEL" == "beta" ]]; then
              LAST_BETA="$(
                git tag --list "v${NEW_VERSION}-beta.*" \
                  | sed -nE "s/^v${NEW_VERSION//./\\.}-beta\.([0-9]+)$/\1/p" \
                  | sort -n \
                  | tail -n1
              )"
              NEW_VERSION="${NEW_VERSION}-beta.$(( ${LAST_BETA:-0} + 1 ))"
            fi
          fi

          if [[ "$NEW_VERSION" == "$CURRENT_VERSION" ]]; then
            echo "Version did not change: $CURRENT_VERSION"
            exit 1
          fi

          if git rev-parse "v$NEW_VERSION" >/dev/null 2>&1; then
            echo "Tag v$NEW_VERSION already exists locally."
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/v$NEW_VERSION" >/dev/null 2>&1; then
            echo "Tag v$NEW_VERSION already exists on origin."
            exit 1
          fi

          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      # The version is known and nothing is tagged yet. Without a line the site's
      # build fails and gryt.chat stops deploying (GRYT-1108).
      - name: Require a changelog line
        shell: bash
        run: |
          set -euo pipefail

          GATE="https://raw.githubusercontent.com/Gryt-chat/gryt/main/.github/scripts/check-release-line.mjs"
          if ! curl -fsSL --retry 3 --retry-all-errors -o "$RUNNER_TEMP/check-release-line.mjs" "$GATE"; then
            echo "Could not download $GATE, so the line was not checked. Nothing is tagged yet."
            exit 1
          fi

          node "$RUNNER_TEMP/check-release-line.mjs" images "${{ steps.version.outputs.version }}"

      - name: Tag the release
        shell: bash
        run: |
          set -euo pipefail
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

    outputs:
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.channel.outputs.channel }}

  # One native build per architecture. Under QEMU the arm64 compile of ffmpeg, dav1d and
  # SVT-AV1 took most of an hour; on its own runner it takes the same few minutes as amd64.
  image:
    name: Build ${{ matrix.arch }}
    needs: release
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v${{ needs.release.outputs.version }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed by digest only; the publish job puts the tags on both at once.
      - name: Build and push by digest
        id: build
        shell: bash
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/${{ matrix.arch }} \
            --build-arg IMAGE_WORKER_VERSION="${{ needs.release.outputs.version }}" \
            --cache-from "type=registry,ref=${IMAGE}:buildcache-${{ matrix.arch }}" \
            --cache-to "type=registry,ref=${IMAGE}:buildcache-${{ matrix.arch }},mode=max" \
            --metadata-file "$RUNNER_TEMP/metadata.json" \
            --output "type=image,name=${IMAGE},push-by-digest=true,name-canonical=true,push=true" .
          DIGEST="$(node -p "require(process.env.RUNNER_TEMP + '/metadata.json')['containerimage.digest']")"
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Keep the digest for the publish job
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1

  publish:
    name: Publish
    needs: [release, image]
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch both digests
        uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests

      - name: Tag the multi-arch image
        id: docker
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ needs.release.outputs.version }}"
          CHANNEL="${{ needs.release.outputs.channel }}"

          V_MAJOR="$(echo "$VERSION" | cut -d. -f1)"
          V_MINOR="$(echo "$VERSION" | cut -d. -f2)"

          TAGS=(
            "${IMAGE}:${VERSION}"
          )

          # A stable release moves latest-beta in the last step, and only if the beta there is older.
          if [[ "$CHANNEL" == "latest" ]]; then
            TAGS+=(
              "${IMAGE}:${V_MAJOR}.${V_MINOR}"
              "${IMAGE}:${V_MAJOR}"
              "${IMAGE}:latest"
            )
          else
            TAGS+=("${IMAGE}:latest-beta")
          fi

          ARGS=()
          for TAG in "${TAGS[@]}"; do
            ARGS+=(-t "$TAG")
          done

          SOURCES=()
          for D in "$RUNNER_TEMP"/digests/*; do
            SOURCES+=("${IMAGE}@sha256:$(basename "$D")")
          done
          if [[ ${#SOURCES[@]} -ne 2 ]]; then
            echo "Expected two digests, got ${#SOURCES[@]}"
            exit 1
          fi

          docker buildx imagetools create "${ARGS[@]}" "${SOURCES[@]}"
          docker buildx imagetools inspect "${IMAGE}:${VERSION}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.release.outputs.version }}
          name: Gryt Media Worker v${{ needs.release.outputs.version }}
          prerelease: ${{ needs.release.outputs.channel == 'beta' }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A release made with GITHUB_TOKEN starts no other workflow, so release:published never fires.
      - name: Announce the release on Discord and Gryt
        uses: Gryt-chat/.github/actions/release-notify@main
        with:
          component: Media Worker
          version: ${{ needs.release.outputs.version }}
          channel: ${{ needs.release.outputs.channel }}
          repository: Gryt-chat/image-worker
          tag: v${{ needs.release.outputs.version }}
          artifact-label: Docker
          artifact-value: ghcr.io/gryt-chat/image-worker:${{ needs.release.outputs.version }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          discord-webhook-url: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
          gryt-webhook-url: ${{ secrets.GRYT_RELEASE_WEBHOOK_URL }}

      # A stable release moves latest-beta too, unless a newer beta is already there, so beta never
      # runs behind prod (GRYT-1236). Last, and gated on the push, so it can't cost the release.
      - name: Bring latest-beta up to this release
        if: ${{ !cancelled() && steps.docker.outcome == 'success' && needs.release.outputs.channel == 'latest' }}
        shell: bash
        run: |
          set -euo pipefail

          SCRIPT="https://raw.githubusercontent.com/Gryt-chat/gryt/main/.github/scripts/beta-follows-latest.mjs"
          if ! curl -fsSL --retry 3 --retry-all-errors -o "$RUNNER_TEMP/beta-follows-latest.mjs" "$SCRIPT"; then
            echo "Could not download $SCRIPT, so latest-beta was left where it is."
            exit 1
          fi

          TARGET="$(node "$RUNNER_TEMP/beta-follows-latest.mjs" "$IMAGE" "${{ needs.release.outputs.version }}")"
          if [[ -n "$TARGET" ]]; then
            docker buildx imagetools create -t "${IMAGE}:latest-beta" "${IMAGE}@${TARGET}"
          fi
