name: Release Image Worker

# The one component with no way to ship: Release Server moves this gitlink and never builds
# the image. Modelled on the SFU's release, so the channel decides the floating tag.

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Release Channel"
        required: true
        default: "beta"
        type: choice
        options:
          - beta
          - latest
      bump:
        description: "Version Bump Type"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
          - custom
      custom_version:
        description: 'Custom Version, if "custom" is selected'
        required: false
        default: ""
        type: string

permissions:
  contents: write
  packages: write

env:
  RELEASE_OWNER: Gryt-chat
  RELEASE_REPO: image-worker
  IMAGE: ghcr.io/gryt-chat/image-worker

jobs:
  release:
    name: Release Image Worker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Git user
        shell: bash
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Determine channel
        id: channel
        shell: bash
        run: |
          set -euo pipefail

          CHANNEL="${{ github.event.inputs.channel }}"

          if [[ "$CHANNEL" != "beta" && "$CHANNEL" != "latest" ]]; then
            echo "Invalid channel: $CHANNEL"
            exit 1
          fi

          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"

      # Build before bumping. A tag pushed for something that does not compile
      # is harder to take back than a failed run.
      - name: Install and build
        shell: bash
        run: |
          set -euo pipefail
          yarn install --frozen-lockfile
          yarn build

      - name: Determine version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          CHANNEL="${{ steps.channel.outputs.channel }}"

          # The tag is the source of truth, not package.json: main is protected. Stable
          # tags only, so a beta never becomes the base of the next bump.
          CURRENT_VERSION="$(
            git -c versionsort.suffix=-alpha -c versionsort.suffix=-beta -c versionsort.suffix=-rc \
                tag --list 'v*' --sort=-v:refname \
              | grep -Ex 'v[0-9]+\.[0-9]+\.[0-9]+' \
              | sed -n '1s/^v//p' || true
          )"

          if [[ -z "$CURRENT_VERSION" ]]; then
            CURRENT_VERSION="$(node -p "require('./package.json').version")"
          fi
          BUMP="${{ github.event.inputs.bump }}"
          CUSTOM_VERSION="${{ github.event.inputs.custom_version }}"

          if ! [[ "$CURRENT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid current version: $CURRENT_VERSION"
            exit 1
          fi

          if [[ "$BUMP" == "custom" ]]; then
            if [[ -z "$CUSTOM_VERSION" ]]; then
              echo "custom_version is required when bump=custom"
              exit 1
            fi

            # Same shapes checkout-release-tag.sh in Gryt-chat/gryt sorts into each channel.
            if [[ "$CHANNEL" == "beta" ]]; then
              CUSTOM_PATTERN='^[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta|rc)\.[0-9]+$'
              CUSTOM_EXAMPLE="1.2.3-beta.1"
            else
              CUSTOM_PATTERN='^[0-9]+\.[0-9]+\.[0-9]+$'
              CUSTOM_EXAMPLE="1.2.3"
            fi

            if ! [[ "$CUSTOM_VERSION" =~ $CUSTOM_PATTERN ]]; then
              echo "Invalid custom version for the $CHANNEL channel: $CUSTOM_VERSION"
              echo "Expected something like $CUSTOM_EXAMPLE"
              exit 1
            fi

            NEW_VERSION="$CUSTOM_VERSION"
          else
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"

            case "$BUMP" in
              major) NEW_VERSION="$((MAJOR + 1)).0.0" ;;
              minor) NEW_VERSION="$MAJOR.$((MINOR + 1)).0" ;;
              patch) NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))" ;;
              *)
                echo "Invalid bump type: $BUMP"
                exit 1
                ;;
            esac

            if [[ "$CHANNEL" == "beta" ]]; then
              LAST_BETA="$(
                git tag --list "v${NEW_VERSION}-beta.*" \
                  | sed -nE "s/^v${NEW_VERSION//./\\.}-beta\.([0-9]+)$/\1/p" \
                  | sort -n \
                  | tail -n1
              )"
              NEW_VERSION="${NEW_VERSION}-beta.$(( ${LAST_BETA:-0} + 1 ))"
            fi
          fi

          if [[ "$NEW_VERSION" == "$CURRENT_VERSION" ]]; then
            echo "Version did not change: $CURRENT_VERSION"
            exit 1
          fi

          if git rev-parse "v$NEW_VERSION" >/dev/null 2>&1; then
            echo "Tag v$NEW_VERSION already exists locally."
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/v$NEW_VERSION" >/dev/null 2>&1; then
            echo "Tag v$NEW_VERSION already exists on origin."
            exit 1
          fi

          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      # The version is known and nothing is tagged yet. Without a line the site's
      # build fails and gryt.chat stops deploying (GRYT-1108).
      - name: Require a changelog line
        shell: bash
        run: |
          set -euo pipefail

          GATE="https://raw.githubusercontent.com/Gryt-chat/gryt/main/.github/scripts/check-release-line.mjs"
          if ! curl -fsSL --retry 3 --retry-all-errors -o "$RUNNER_TEMP/check-release-line.mjs" "$GATE"; then
            echo "Could not download $GATE, so the line was not checked. Nothing is tagged yet."
            exit 1
          fi

          node "$RUNNER_TEMP/check-release-line.mjs" images "${{ steps.version.outputs.version }}"

      - name: Tag the release
        shell: bash
        run: |
          set -euo pipefail
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ steps.version.outputs.version }}"
          CHANNEL="${{ steps.channel.outputs.channel }}"

          V_MAJOR="$(echo "$VERSION" | cut -d. -f1)"
          V_MINOR="$(echo "$VERSION" | cut -d. -f2)"

          # latest-beta always moves: a stable release is also the newest thing a beta
          # follower should be on, and leaving it behind would strand them.
          TAGS=(
            "${IMAGE}:${VERSION}"
            "${IMAGE}:latest-beta"
          )

          if [[ "$CHANNEL" == "latest" ]]; then
            TAGS+=(
              "${IMAGE}:${V_MAJOR}.${V_MINOR}"
              "${IMAGE}:${V_MAJOR}"
              "${IMAGE}:latest"
            )
          fi

          ARGS=()
          for TAG in "${TAGS[@]}"; do
            ARGS+=(-t "$TAG")
          done

          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg IMAGE_WORKER_VERSION="${{ steps.version.outputs.version }}" \
            --cache-from type=registry,ref=${IMAGE}:buildcache \
            --cache-to type=registry,ref=${IMAGE}:buildcache,mode=max \
            "${ARGS[@]}" \
            --push .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Gryt Image Worker v${{ steps.version.outputs.version }}
          prerelease: ${{ steps.channel.outputs.channel == 'beta' }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A release made with GITHUB_TOKEN starts no other workflow, so release:published never fires.
      - name: Notify Discord
        shell: bash
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
          VERSION: ${{ steps.version.outputs.version }}
          CHANNEL: ${{ steps.channel.outputs.channel }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "${WEBHOOK_URL:-}" ]]; then
            echo "DISCORD_RELEASE_WEBHOOK_URL secret not set, skipping"
            exit 0
          fi

          TAG="v$VERSION"
          RELEASE_URL="https://github.com/${RELEASE_OWNER}/${RELEASE_REPO}/releases/tag/$TAG"

          if [[ "$CHANNEL" == "beta" ]]; then
            DISP_CHANNEL="Beta"
            COLOR=16750848
          else
            DISP_CHANNEL="Stable"
            COLOR=5763719
          fi

          RELEASE_BODY="$(gh release view "$TAG" --repo "${RELEASE_OWNER}/${RELEASE_REPO}" --json body -q '.body' || true)"
          BODY="$(printf '%s' "$RELEASE_BODY" | head -c 1800)"

          PAYLOAD="$(jq -n \
            --arg title "Gryt Image Worker $TAG" \
            --arg url "$RELEASE_URL" \
            --arg desc "$BODY" \
            --arg channel "$DISP_CHANNEL" \
            --arg component "Image Worker" \
            --arg tag "$TAG" \
            --argjson color "$COLOR" \
            '{
              embeds: [{
                title: $title,
                url: $url,
                description: $desc,
                color: $color,
                fields: [
                  { name: "Component", value: $component, inline: true },
                  { name: "Channel", value: $channel, inline: true },
                  { name: "Version", value: $tag, inline: true }
                ],
                footer: { text: "Gryt Releases" },
                timestamp: (now | todate)
              }]
            }'
          )"

          curl -sfS \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$WEBHOOK_URL"
