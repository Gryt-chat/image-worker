name: Gryt Git notification smoke

on:
  push:
    branches: [fix/gryt-git-notify-events]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: Gryt-chat/.github/actions/notify@fix/gryt-git-notify-events
        with:
          gryt-webhook-url: ${{ secrets.GRYT_GIT_WEBHOOK_URL }}
          gryt-payload: >-
            {"display_name":"GitHub","cards":[{"title":"Gryt webhook smoke test","description":"Redirect handling validation","color":"#968ff8"}]}
